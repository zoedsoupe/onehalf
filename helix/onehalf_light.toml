# Author : zoedsoupe (Zoey) <zoey.spessanha@zeetech.io>

# Define the theme properties
inherits = "default"

# UI elements
"ui.background" = { bg = "white" }
"ui.text" = { fg = "black" }
"ui.cursor" = { fg = "white", bg = "blue" }
"ui.cursor.primary" = { fg = "white", bg = "blue" }
"ui.cursor.match" = { fg = "blue", modifiers = ["underlined"] }
"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection" }
"ui.cursorline.primary" = { bg = "cursor_line" }
"ui.statusline" = { fg = "black", bg = "cursor_line" }
"ui.statusline.inactive" = { fg = "dark_gray", bg = "cursor_line" }
"ui.statusline.normal" = { fg = "white", bg = "blue", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "white", bg = "green", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "white", bg = "magenta", modifiers = ["bold"] }
"ui.bufferline" = { fg = "dark_gray", bg = "cursor_line" }
"ui.bufferline.active" = { fg = "cursor_line", bg = "blue" }
"ui.linenr" = { fg = "gutter_fg", bg = "white" }
"ui.linenr.selected" = { fg = "black", bg = "cursor_line" }
"ui.popup" = { fg = "black", bg = "light_gray" }
"ui.window" = { fg = "cursor_line" }
"ui.help" = { fg = "black", bg = "light_gray" }
"ui.virtual" = { fg = "dark_gray" }
"ui.virtual.ruler" = { bg = "cursor_line" }
"ui.virtual.indent-guide" = { fg = "dark_gray" }
"ui.virtual.whitespace" = { fg = "dark_gray" }
"ui.virtual.inlay-hint" = { fg = "dark_gray" }
"ui.menu" = { fg = "black", bg = "light_gray" }
"ui.menu.selected" = { fg = "white", bg = "blue" }
"ui.menu.scroll" = { fg = "black", bg = "light_gray" }
"ui.highlight" = { bg = "cursor_line" }

# Syntax highlighting
"comment" = { fg = "dark_gray", modifiers = ["italic"] }
"constant" = { fg = "cyan" }
"constant.numeric" = { fg = "yellow" }
"constant.character.escape" = { fg = "yellow" }
"constant.builtin" = { fg = "yellow" }
"constant.builtin.boolean" = { fg = "yellow" }
"string" = { fg = "green" }
"string.regexp" = { fg = "green" }
"string.special" = { fg = "green" }

"keyword" = { fg = "magenta" }
"keyword.control" = { fg = "magenta" }
"keyword.control.import" = { fg = "red" }
"keyword.function" = { fg = "magenta" }
"keyword.operator" = { fg = "magenta" }
"keyword.directive" = { fg = "magenta" }
"keyword.storage" = { fg = "magenta" }
"keyword.storage.type" = { fg = "magenta" }
"keyword.storage.modifier" = { fg = "magenta" }

"operator" = { fg = "black" }
"punctuation" = { fg = "black" }
"punctuation.delimiter" = { fg = "black" }
"punctuation.bracket" = { fg = "black" }
"punctuation.special" = { fg = "black" }

"variable" = { fg = "red" }
"variable.builtin" = { fg = "blue" }
"variable.parameter" = { fg = "red" }
"variable.other.member" = { fg = "red" }

"type" = { fg = "yellow" }
"type.builtin" = { fg = "yellow" }
"type.enum.variant" = { fg = "yellow" }

"constructor" = { fg = "blue" }
"function" = { fg = "blue" }
"function.builtin" = { fg = "blue" }
"function.method" = { fg = "blue" }
"function.macro" = { fg = "magenta" }
"function.special" = { fg = "blue" }

"tag" = { fg = "red" }
"attribute" = { fg = "yellow" }
"namespace" = { fg = "blue" }
"special" = { fg = "blue" }
"label" = { fg = "magenta" }

# Markup
"markup.heading" = { fg = "red" }
"markup.bold" = { fg = "yellow", modifiers = ["bold"] }
"markup.italic" = { fg = "magenta", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "cyan", modifiers = ["underlined"] }
"markup.link.text" = { fg = "magenta" }
"markup.raw" = { fg = "green" }
"markup.quote" = { fg = "yellow" }
"markup.list" = { fg = "red" }

# Diagnostics
"diagnostic" = { underline = { style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "green", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

"info" = { fg = "blue", modifiers = ["bold"] }
"hint" = { fg = "green", modifiers = ["bold"] }
"warning" = { fg = "yellow", modifiers = ["bold"] }
"error" = { fg = "red", modifiers = ["bold"] }

# Diff
"diff.plus" = { fg = "green", bg = "white" }
"diff.minus" = { fg = "red", bg = "white" }
"diff.delta" = { fg = "yellow", bg = "white" }
"diff.delta.moved" = { fg = "blue", bg = "white" }

# Define the color palette
[palette]
black = "#383a42"
red = "#e45649"
green = "#50a14f"
yellow = "#c18401"
blue = "#0184bc"
magenta = "#a626a4"
cyan = "#0997b3"
white = "#fafafa"
dark_gray = "#9a9a9a"
gutter_fg = "#9a9a9a"
cursor_line = "#f0f0f0"
light_gray = "#e5e5e6"
selection = "#d4d4d4"